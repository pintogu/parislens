name: parislens

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parislens
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d parislens"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  job_runner:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/parislens
    command: ["./run_job.sh", "full"]
    volumes:
      - pipeline_logs:/app
      - model_artifacts:/app/model_artifacts
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /app/model_artifacts/lgb_model_latest.joblib
      DATABASE_URL: postgresql://admin:password@postgres:5432/parislens
    ports:
      - "8001:8000"
    volumes:
      - model_artifacts:/app/model_artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/parislens
    ports:
      - "8501:8501"
    depends_on:
      - api
      - postgres
    restart: unless-stopped

volumes:
  pg_data:
    name: parislens_pg_data
  pipeline_logs:
  model_artifacts:
